# nginx reverse-proxy snippet for kaggle2 at /teb2/
# Drop this into /etc/nginx/sites-available/portearchive and reload nginx.
#
# sudo ln -s /etc/nginx/sites-available/portearchive /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

location /teb2/ {
    proxy_pass         http://127.0.0.1:8000/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Allow larger receipt image uploads (default 1 MB is too small)
    client_max_body_size 20M;

    # Keep connections alive to uvicorn
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
}
