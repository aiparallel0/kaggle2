# nginx reverse-proxy snippet for the kaggle2 DONUT demo at /teb2/.
#
# Install path on the portearchive.com droplet:
#   sudo install -m 0644 deploy/nginx-teb2.conf \
#       /etc/nginx/snippets/portearchive-apps/teb2.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The apex `site` repo's nginx template auto-includes everything in
# /etc/nginx/snippets/portearchive-apps/*.conf inside its HTTPS server { }
# block, so this snippet does NOT need its own server { } wrapper. See
# PORTEARCHIVE_ROUTING.md in the `site` repo for the canonical multi-app
# contract (paths, ports, owners, CSP).

location /teb2/ {
    include /etc/nginx/snippets/portearchive-security-headers.conf;
    # Demo's drag-and-drop UI uses inline event handlers + a small inline
    # script. 'unsafe-inline' is scoped to /teb2/ only — the apex / and
    # /github-webhook locations remain strict-CSP.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_pass         http://127.0.0.1:8000/;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Allow larger receipt image uploads (default 1 MB is too small).
    client_max_body_size 20M;

    # Keep connections alive to uvicorn.
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
}
