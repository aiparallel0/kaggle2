[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data/sroie_cache", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501 (line-length) handled by formatter; ignore noisy ones for ML code.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
