[mypy]
strict = True
python_version = 3.11

# Third-party packages without stubs — expected; not a code defect
[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-ultralytics.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-sentencepiece.*]
ignore_missing_imports = True
