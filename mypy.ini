[mypy]
strict = True
python_version = 3.11
# data/sroie_cache/ is a runtime cache (SROIE images, GT, and the transient
# upstream git clone in _git/). It must never be type-checked: the upstream
# repo ships duplicate top-level modules (task1/SSD Method/src/train.py and
# task1/CTPN Method/main/train.py) that crash mypy with a "Duplicate module
# named train" error. The cache is fixtures-only per AGENTS.md.
exclude = (?x)(
    ^data/sroie_cache/
  )

# Third-party packages without stubs — expected; not a code defect
[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-ultralytics]
ignore_missing_imports = True
follow_imports = skip

[mypy-ultralytics.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-sentencepiece.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-psutil]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-huggingface_hub]
ignore_missing_imports = True

[mypy-certifi]
ignore_missing_imports = True
