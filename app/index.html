<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>kaggle2 — receipt KIE demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0e1117; --fg:#e6edf3; --mut:#8b949e; --acc:#2f81f7; --ok:#3fb950;
          --warn:#d29922; --err:#f85149; --card:#161b22; --bd:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
         background:var(--bg); color:var(--fg); }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { color: var(--mut); margin-bottom: 24px; }
  .banner { padding:10px 14px; border-radius:6px; margin-bottom:20px;
            border:1px solid var(--bd); background:var(--card); }
  .banner.warn { border-color: var(--warn); color: var(--warn); }
  .banner.ok   { border-color: var(--ok);   color: var(--ok); }
  #drop { border: 2px dashed var(--bd); border-radius: 10px; padding: 36px;
          text-align: center; color: var(--mut); background: var(--card);
          cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.drag { border-color: var(--acc); background: #0d2a4a; color: var(--fg); }
  #drop input { display: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 680px) { .row { grid-template-columns: 1fr; } }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px;
          padding:16px; min-height: 160px; }
  .card h2 { margin:0 0 10px; font-size:14px; letter-spacing:.04em;
             text-transform: uppercase; color: var(--mut); }
  img.preview { max-width: 100%; max-height: 320px; border-radius: 6px; display: block; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 6px; border-bottom: 1px solid var(--bd); vertical-align: top; }
  td.k { color: var(--mut); width: 110px; text-transform: capitalize; }
  td.v { word-break: break-word; }
  .spin { color: var(--acc); }
  .err  { color: var(--err); }
  footer { margin-top: 32px; color: var(--mut); font-size: 13px; }
  code { background:#0b0f14; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>kaggle2 — receipt KIE demo</h1>
  <div class="sub">DONUT end-to-end. Drop a receipt image. Get <code>company</code>,
    <code>date</code>, <code>address</code>, <code>total</code>.</div>

  <div id="status" class="banner">Checking model…</div>

  <label id="drop">
    <input type="file" id="file" accept="image/*" />
    <div><b>Drop a receipt here</b> or click to choose</div>
    <div style="font-size:13px;margin-top:6px">JPEG / PNG / WEBP</div>
  </label>

  <div class="row">
    <div class="card"><h2>Image</h2>
      <div id="preview"><div style="color:var(--mut)">No image yet.</div></div></div>
    <div class="card"><h2>Extracted fields</h2>
      <div id="result"><div style="color:var(--mut)">Upload to run inference.</div></div></div>
  </div>

  <footer>
    <code>POST /predict</code> (multipart <code>file</code>) → JSON. <code>GET /health</code>
    reports <code>finetuned</code> vs <code>base</code> model.
  </footer>
</main>

<script>
const drop = document.getElementById("drop");
const fileEl = document.getElementById("file");
const resultEl = document.getElementById("result");
const previewEl = document.getElementById("preview");
const statusEl = document.getElementById("status");

fetch("/health").then(r => r.json()).then(h => {
  if (!h.model_loaded) {
    statusEl.className = "banner";
    statusEl.textContent = "Model will load on first prediction.";
  } else if (h.model_source === "base") {
    statusEl.className = "banner warn";
    statusEl.textContent = "⚠ Base donut-base loaded (not fine-tuned). " +
      "Predictions will be poor until you run `make train`.";
  } else {
    statusEl.className = "banner ok";
    statusEl.textContent = "Fine-tuned DONUT loaded from " + h.model_path +
      " on " + h.device + ".";
  }
}).catch(() => {
  statusEl.className = "banner"; statusEl.textContent = "Status unknown.";
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

async function upload(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  previewEl.innerHTML = `<img class="preview" src="${url}" alt="preview" />`;
  resultEl.innerHTML = `<div class="spin">Running DONUT…</div>`;
  const fd = new FormData(); fd.append("file", file);
  try {
    const r = await fetch("/predict", { method: "POST", body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
    const order = ["company", "date", "address", "total"];
    const keys = Array.from(new Set([...order, ...Object.keys(j.fields || {})]));
    const rows = keys.map(k => {
      const v = j.fields && j.fields[k];
      return `<tr><td class="k">${escapeHtml(k)}</td>` +
             `<td class="v">${v ? escapeHtml(v) : '<span style="color:var(--mut)">—</span>'}</td></tr>`;
    }).join("");
    resultEl.innerHTML = `<table>${rows}</table>` +
      `<div style="margin-top:10px;color:var(--mut);font-size:13px">` +
      `model: ${escapeHtml(j.model_source)}</div>`;
  } catch (e) {
    resultEl.innerHTML = `<div class="err">${escapeHtml(e.message || e)}</div>`;
  }
}

drop.addEventListener("click", () => fileEl.click());
fileEl.addEventListener("change", e => upload(e.target.files[0]));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("drag");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
