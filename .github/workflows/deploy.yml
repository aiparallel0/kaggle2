name: deploy

# Auto-deploy to portearchive.com whenever a push reaches main AND ci passes.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # Only deploy when the CI workflow succeeded (not on failure/cancel)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /var/www/kaggle2
            git fetch --quiet origin main
            git reset --hard origin/main
            sudo systemctl restart kaggle2
            echo "Deploy complete — $(git rev-parse --short HEAD)"
