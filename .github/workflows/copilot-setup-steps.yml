name: "Copilot Setup Steps"

# Pre-install the static analysis and smoke-test tools (mypy, ruff, Pillow)
# so that `make check` works immediately in the agent environment without
# requiring a separate install step.  Pillow is needed for the import
# smoke-test that validates core/types and core/config load cleanly.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: intentionally no ``cache: pip``. The Post-action that saves
      # pip's cache has repeatedly failed on this runner ("Post Run
      # actions/setup-python@v5" → Copilot halts mid-task). We install only
      # three small wheels here, so the cache round-trip provides negligible
      # speedup and any transient cache-upload failure aborts the whole job.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install static-analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir \
            "mypy==1.10.0" \
            "ruff==0.4.4" \
            "Pillow==11.1.0"
