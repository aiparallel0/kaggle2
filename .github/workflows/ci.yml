name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # mypy.ini sets ignore_missing_imports for torch/transformers/etc., so we
      # only need lightweight deps here. The Dockerfile handles the full GPU
      # stack for real training runs.
      - name: install lint + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mypy==1.10.0" "ruff==0.4.4" "pytest==8.2.0" "Pillow==11.1.0"

      - name: ruff
        run: ruff check .

      - name: mypy --strict
        run: mypy --strict core/ data/ models/ report/ stages/ main.py

      - name: import smoke test
        run: |
          python -c "from core.types import Receipt, Metrics; from core.config import load_config"

      # unit tests disabled
      # - name: unit tests
      #   run: python -m pytest -q tests/
